[tool.poetry]
name = "sustainadish-backend"
version = "1.0.0"
description = "Backend for Sustainadish recipe recommendation system"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.3"
flask-cors = "^4.0.1"
werkzeug = "^3.0.3"
python-dotenv = "^1.0.1"
gunicorn = ">=21.2.0,<23.0.0"
numpy = "^2.1.0"
pandas = "^2.2.3"
scipy = "^1.14.0"
scikit-learn = "^1.5.2"
nltk = "^3.9.1"
pyspellchecker = "^0.7.2"
google-genai = "^0.3.0"
pyarrow = "^12.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"