name: CI

on:
  push:
    branches: [main, develop, feat/geolocation]
  pull_request:
    branches: [main, develop, feat/geolocation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build --if-present
      - run: npm test --if-present
      - run: exit 1